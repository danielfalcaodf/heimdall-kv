name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # ─── Verificação de segurança ─────────────────────────────────────────────
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar arquivos .env reais versionados
        run: |
          if git ls-files | grep -E '^\.env$'; then
            echo "ERRO: arquivo .env real encontrado no repositório. Remova-o do tracking."
            exit 1
          fi
          echo "OK: nenhum arquivo .env real versionado."

      - name: Verificar padrões óbvios de segredos
        run: |
          PATTERNS='(password|secret|token|api_key|apikey|private_key)\s*=\s*["\047][^"\047]{6,}'
          if git ls-files | xargs grep -rliE "$PATTERNS" 2>/dev/null | grep -v '.example' | grep -v '.md'; then
            echo "AVISO: possíveis segredos encontrados nos arquivos acima. Revise antes de mergear."
            exit 1
          fi
          echo "OK: nenhum padrão óbvio de segredo encontrado."

  # ─── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm nx run-many -t lint --all

  # ─── Typecheck ────────────────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm nx run-many -t typecheck --all

  # ─── Testes ───────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: security
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Testes unitários
        run: pnpm nx run-many -t test --all --passWithNoTests
